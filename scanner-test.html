<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BelegApp – Scanner-Test</title>
<style>body{font:16px Arial,sans-serif;background:#f2f4f3;margin:0;padding:20px;color:#222}main{max-width:600px;margin:auto;background:white;padding:20px;border-radius:14px}button,input{font:inherit;margin:8px 0;padding:12px}button{background:#176b50;color:white;border:0;border-radius:8px}img{max-width:100%;display:block;margin:12px 0;border:1px solid #ddd}#status{padding:10px;background:#eee;border-radius:8px;white-space:pre-wrap}</style></head>
<body><main><h2>BelegScanner – Funktionstest</h2><p>Wähle ein Foto eines Belegs. Die Erkennung startet erst nach dem Fotografieren bzw. Auswählen.</p>
<input id="photo" type="file" accept="image/*" capture="environment"><div><button id="run" disabled>Beleg automatisch zuschneiden</button></div><p id="status">Noch kein Foto ausgewählt.</p><h3>Original</h3><img id="original" hidden><h3>Ergebnis</h3><img id="result" hidden></main>
<script src="scanner.js"></script><script>
const input=document.getElementById('photo'),run=document.getElementById('run'),status=document.getElementById('status'),original=document.getElementById('original'),result=document.getElementById('result');let file=null,originalUrl=null,resultUrl=null;
input.addEventListener('change',()=>{file=input.files&&input.files[0];if(!file)return;if(originalUrl)URL.revokeObjectURL(originalUrl);if(resultUrl)URL.revokeObjectURL(resultUrl);originalUrl=URL.createObjectURL(file);original.src=originalUrl;original.hidden=false;result.hidden=true;run.disabled=false;status.textContent='Foto übernommen. Noch nicht zugeschnitten.';});
run.addEventListener('click',async()=>{if(!file)return;run.disabled=true;status.textContent='Erkennung läuft …';const scan=await BelegScanner.scan(file);if(resultUrl)URL.revokeObjectURL(resultUrl);resultUrl=URL.createObjectURL(scan.blob);result.src=resultUrl;result.hidden=false;status.textContent=scan.message;run.disabled=false;});
</script></body></html>
