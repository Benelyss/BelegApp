<script>

// IndexedDB Datenbank

const DB_NAME = "BelegAppDB";

const DB_VERSION = 1;

let db;



function datenbankOeffnen(){

    return new Promise((resolve,reject)=>{

        const request=indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded=()=>{

            const database=request.result;

            if(!database.objectStoreNames.contains("belege")){

                database.createObjectStore("belege",{keyPath:"id",autoIncrement:true});

            }

        };

        request.onsuccess=()=>{db=request.result;resolve(db);};

        request.onerror=()=>reject(request.error);

    });

}



function speichernBeleg(datensatz){

    return new Promise((resolve,reject)=>{

        const tx=db.transaction("belege","readwrite");

        tx.objectStore("belege").add(datensatz);

        tx.oncomplete=()=>resolve();

        tx.onerror=()=>reject(tx.error);

    });

}



function alleBelege(){

    return new Promise((resolve,reject)=>{

        const tx=db.transaction("belege","readonly");

        const request=tx.objectStore("belege").getAll();

        request.onsuccess=()=>resolve(request.result);

        request.onerror=()=>reject(request.error);

    });

}



function archivBelegLoeschen(id){

    return new Promise((resolve,reject)=>{

        const tx=db.transaction("belege","readwrite");

        tx.objectStore("belege").delete(id);

        tx.oncomplete=()=>resolve();

        tx.onerror=()=>reject(tx.error);

    });

}



// Lokales Datum initialisieren

function heutigesDatumLokal(){

    const d=new Date();

    d.setMinutes(d.getMinutes()-d.getTimezoneOffset());

    return d.toISOString().slice(0,10);

}

document.getElementById("datum").value=heutigesDatumLokal();



// Ansicht wechseln

function ansicht(name){

    document.getElementById("viewNeu").classList.toggle("active",name==="neu");

    document.getElementById("viewArchiv").classList.toggle("active",name==="archiv");

    document.getElementById("navNew").classList.toggle("active",name==="neu");

    document.getElementById("navArchive").classList.toggle("active",name==="archiv");

    if(name==="archiv")archivAnzeigen();

}



// Bilderhandling

let belegBilder=[];

async function bilderHinzufuegen(input){
    const startIndex=belegBilder.length;
    Array.from(input.files).forEach(file=>{
        if(file.type.startsWith("image/"))belegBilder.push({datei:file,url:URL.createObjectURL(file),scanned:false});
    });
    input.value="";
    vorschauAktualisieren();
    // IMPORTANT: Do not start OpenCV automatically after camera capture.
    // Keep the photo visible and the app responsive; scanning is manual via its button.
    document.getElementById("status").textContent="Foto hinzugefügt. Du kannst den Scan bei Bedarf manuell starten.";
}

function vorschauAktualisieren(){
    const container=document.getElementById("fotoVorschau");
    container.innerHTML="";
    belegBilder.forEach((bild,index)=>{
        const div=document.createElement("div");div.className="photo-item";
        const img=document.createElement("img");img.src=bild.url;
        const nummer=document.createElement("span");nummer.className="photo-number";nummer.textContent=index+1;
        const del=document.createElement("button");del.className="delete-photo";del.type="button";del.textContent="×";del.onclick=()=>bildLoeschen(index);
        const scan=document.createElement("button");scan.className="scan-button";scan.type="button";
        scan.textContent=bild.scanned?"✓ Gescannt – erneut scannen":"✂️ Automatisch zuschneiden";
        scan.onclick=()=>belegAutomatischScannen(index);
        const status=document.createElement("div");status.className="scan-status";status.textContent=bild.scanned?"Scan angewendet":"Foto unverändert";
        div.append(img,nummer,del,scan,status);container.appendChild(div);
    });
    document.getElementById("pdfButton").disabled=belegBilder.length===0;
}

let cvLadePromise=null;
function opencvBereit(){
    if(cvLadePromise)return cvLadePromise;
    cvLadePromise=new Promise((resolve,reject)=>{
        const timeout=setTimeout(()=>reject(new Error("Scanner-Bibliothek konnte nicht geladen werden. Internetverbindung prüfen.")),25000);
        const check=()=>{
            if(window.cv&&window.cv.Mat){clearTimeout(timeout);resolve(window.cv);}
            else setTimeout(check,150);
        };
        check();
    });
    return cvLadePromise;
}
function bildLaden(url){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("Bild konnte nicht geladen werden."));img.src=url;});}
function blobAlsDatei(blob,name){return new File([blob],name,{type:blob.type||"image/jpeg"});}
function sortiereEcken(pts){
    const sum=pts.map(p=>p.x+p.y),diff=pts.map(p=>p.y-p.x);
    return [pts[sum.indexOf(Math.min(...sum))],pts[diff.indexOf(Math.min(...diff))],pts[sum.indexOf(Math.max(...sum))],pts[diff.indexOf(Math.max(...diff))]];
}
async function belegAutomatischScannen(index){
    const status=document.getElementById("status");status.textContent="Beleg wird automatisch erkannt und zugeschnitten …";
    let mats=[];
    try{
        const cv=await opencvBereit(),source=belegBilder[index],img=await bildLaden(source.url);
        const ratio=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*ratio),h=Math.round(img.naturalHeight*ratio);
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);
        const src=cv.imread(canvas),gray=new cv.Mat(),blur=new cv.Mat(),edges=new cv.Mat(),contours=new cv.MatVector(),hierarchy=new cv.Mat();mats=[src,gray,blur,edges,contours,hierarchy];
        cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);cv.Canny(blur,edges,50,150);cv.findContours(edges,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
        let best=null,areaMax=0;
        for(let i=0;i<contours.size();i++){
            const c=contours.get(i),approx=new cv.Mat();cv.approxPolyDP(c,approx,0.02*cv.arcLength(c,true),true);
            if(approx.rows===4&&cv.isContourConvex(approx)){const area=cv.contourArea(approx);if(area>areaMax&&area>w*h*0.08){let pts=[];for(let j=0;j<4;j++)pts.push({x:approx.data32S[j*2],y:approx.data32S[j*2+1]});best=pts;areaMax=area;}}
            approx.delete();c.delete();
        }
        if(!best){status.textContent="Kanten nicht sicher erkannt – Original bleibt erhalten.";alert("Belegkanten nicht sicher erkannt. Das Originalfoto bleibt erhalten.");return;}
        const [tl,tr,br,bl]=sortiereEcken(best);
        const ow=Math.round(Math.max(Math.hypot(br.x-bl.x,br.y-bl.y),Math.hypot(tr.x-tl.x,tr.y-tl.y))),oh=Math.round(Math.max(Math.hypot(tr.x-br.x,tr.y-br.y),Math.hypot(tl.x-bl.x,tl.y-bl.y)));
        const srcPts=cv.matFromArray(4,1,cv.CV_32FC2,[tl.x,tl.y,tr.x,tr.y,br.x,br.y,bl.x,bl.y]),dstPts=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,ow-1,0,ow-1,oh-1,0,oh-1]);mats.push(srcPts,dstPts);
        const transform=cv.getPerspectiveTransform(srcPts,dstPts),warped=new cv.Mat();mats.push(transform,warped);
        cv.warpPerspective(src,warped,transform,new cv.Size(ow,oh),cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(255,255,255,255));
        const out=document.createElement("canvas");cv.imshow(out,warped);const blob=await new Promise(r=>out.toBlob(r,"image/jpeg",0.94));if(!blob)throw new Error("Scan konnte nicht erstellt werden.");
        URL.revokeObjectURL(source.url);source.datei=blobAlsDatei(blob,"scan_"+(index+1)+".jpg");source.url=URL.createObjectURL(blob);source.scanned=true;
        vorschauAktualisieren();status.textContent="Scan erfolgreich. Beleg automatisch zugeschnitten.";
    }catch(err){console.error(err);status.textContent="Scannerfehler – Original bleibt erhalten.";alert("Scan nicht möglich. Originalfoto bleibt erhalten.\n\n"+err.message);}
    finally{mats.forEach(m=>{try{m.delete();}catch(e){}});}
}
function bildLoeschen(index){
    URL.revokeObjectURL(belegBilder[index].url);belegBilder.splice(index,1);vorschauAktualisieren();
}


// Konten hinzufügen

function checkKonto(){

    document.getElementById("neuesKonto").style.display=

        document.getElementById("konto").value==="NEU"?"block":"none";

}

function kontoHinzufuegen(){

    const nummer=document.getElementById("neueNummer").value.trim();

    const name=document.getElementById("neueBezeichnung").value.trim();

    if(!nummer||!name){alert("Bitte Kontonummer und Bezeichnung eingeben.");return;}

    const select=document.getElementById("konto");

    for(const o of select.options){

        if(o.value===nummer){alert("Diese Kontonummer existiert bereits.");return;}

    }

    const opt=document.createElement("option");

    opt.value=nummer;

    opt.dataset.bezeichnung=name;

    opt.textContent=nummer+" – "+name;

    select.insertBefore(opt,select.options[select.options.length-1]);

    select.value=nummer;

    document.getElementById("neueNummer").value="";

    document.getElementById("neueBezeichnung").value="";

    document.getElementById("neuesKonto").style.display="none";

    alert("Konto hinzugefügt.");

}



function dateiNameBereinigen(text){

    return text.trim().replace(/[**\\\**/:*?"<>|]/g,"").replace(/\s+/g,"_").replace(/_+/g,"_").replace(/^_+|_+$/g,"");

}



function bildZuJpeg(datei){

    return new Promise((resolve,reject)=>{

        const img=new Image();

        const url=URL.createObjectURL(datei);

        img.onload=()=>{

            const canvas=document.createElement("canvas");

            canvas.width=img.naturalWidth;

            canvas.height=img.naturalHeight;

            const ctx=canvas.getContext("2d");

            ctx.fillStyle="#ffffff";

            ctx.fillRect(0,0,canvas.width,canvas.height);

            ctx.drawImage(img,0,0);

            const jpeg=canvas.toDataURL("image/jpeg",0.92);

            URL.revokeObjectURL(url);

            resolve(jpeg);

        };

        img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Bild konnte nicht verarbeitet werden."));};

        img.src=url;

    });

}



// PDF erzeugen und lokal archivieren

async function pdfErstellen(){

    if(!belegBilder.length){alert("Bitte zuerst ein Belegfoto hinzufügen.");return;}

    const datum=document.getElementById("datum").value;

    const select=document.getElementById("konto");

    const konto=select.value;

    const option=select.options[select.selectedIndex];

    let kontoName=option.textContent.trim().replace(konto,"").replace(/[–-]/,"").trim();

    if(option.dataset.bezeichnung)kontoName=option.dataset.bezeichnung;

    const lieferant=document.getElementById("lieferant").value.trim();

    const betrag=document.getElementById("betrag").value;

    const waehrung=document.getElementById("waehrung").value;

    const bemerkung=document.getElementById("bemerkung").value.trim();



    if(!datum){alert("Bitte Belegdatum eingeben.");return;}

    if(!konto||konto==="NEU"){alert("Bitte Konto auswählen.");return;}

    if(!lieferant){alert("Bitte Lieferant eingeben.");return;}

    if(betrag===""||Number(betrag)<0){alert("Bitte gültigen Betrag eingeben.");return;}



    const button=document.getElementById("pdfButton");

    const status=document.getElementById("status");

    button.disabled=true;

    status.textContent="PDF wird erstellt und archiviert …";



    try{

        const {jsPDF}=window.jspdf;

        const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});

        const pageW=210,pageH=297,margin=8;



        for(let i=0;i<belegBilder.length;i++){

            if(i>0)pdf.addPage();

            const jpeg=await bildZuJpeg(belegBilder[i].datei);

            const props=pdf.getImageProperties(jpeg);

            const scale=Math.min((pageW-2*margin)/props.width,(pageH-2*margin)/props.height);

            const w=props.width*scale,h=props.height*scale;

            pdf.addImage(jpeg,"JPEG",(pageW-w)/2,(pageH-h)/2,w,h,undefined,"FAST");

        }



        pdf.setProperties({title:datum+"_"+konto+"-"+kontoName+"_"+lieferant,subject:"Beleg",author:"BelegApp"});

        const kontoPart=dateiNameBereinigen(konto+"-"+kontoName);

        const lieferantPart=dateiNameBereinigen(lieferant);

        const betragPart=Number(betrag).toFixed(2);

        const filename=datum+"_"+kontoPart+"_"+lieferantPart+"_"+betragPart+".-"+waehrung+".pdf";



        const pdfBlob=pdf.output("blob");



        // Bilder separat als Blobs archivieren

        const bilderBlobs=belegBilder.map(b=>b.datei);



        const record={

            date:datum,

            year:datum.slice(0,4),

            month:datum.slice(0,7),

            account:konto,

            accountName:kontoName,

            supplier:lieferant,

            amount:Number(betrag),

            currency:waehrung,

            note:bemerkung,

            filename,

            pdfBlob,

            images:bilderBlobs,

            created:new Date().toISOString()

        };



        await speichernBeleg(record);



        // PDF zusätzlich herunterladen

        pdf.save(filename);



        status.textContent="Gespeichert und PDF heruntergeladen: "+filename;

        alert("Beleg wurde erstellt und im lokalen Archiv gespeichert.");



        // Erfassungsformular nach erfolgreicher Speicherung zurücksetzen

        belegBilder.forEach(b=>URL.revokeObjectURL(b.url));

        belegBilder=[];

        vorschauAktualisieren();

        document.getElementById("datum").value=heutigesDatumLokal();

        document.getElementById("konto").value="";

        document.getElementById("lieferant").value="";

        document.getElementById("betrag").value="";

        document.getElementById("waehrung").value="CHF";

        document.getElementById("bemerkung").value="";

    }catch(err){

        status.textContent="Fehler bei Erstellung oder Speicherung.";

        alert("PDF oder Archiv konnte nicht erstellt werden. Bitte nochmals versuchen.");

    }finally{

        button.disabled=belegBilder.length===0;

    }

}



// Archiv als ZIP mit Jahr/Monat-Ordnern exportieren
async function archivExportieren(){
    const button=document.getElementById("exportButton");
    button.disabled=true;
    button.textContent="ZIP wird erstellt …";
    try{
        if(!window.JSZip) throw new Error("ZIP-Bibliothek nicht geladen");
        const records=await alleBelege();
        if(!records.length){alert("Das Archiv ist noch leer.");return;}
        const zip=new JSZip();
        records.forEach(r=>{
            const year=r.year || (r.date||"").slice(0,4);
            const month=r.month || (r.date||"").slice(0,7);
            const filename=r.filename || "Beleg.pdf";
            if(r.pdfBlob) zip.file("Belege/"+year+"/"+month+"/"+filename,r.pdfBlob);
        });
        const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download="Belege_Archiv.zip";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
        alert("ZIP-Archiv wurde erstellt. Du kannst es jetzt im gewünschten Ordner speichern.");
    }catch(err){
        console.error(err);
        alert("ZIP-Export fehlgeschlagen. Bitte Internetverbindung prüfen und nochmals versuchen.");
    }finally{
        button.disabled=false;
        button.textContent="📦 Archiv als ZIP exportieren";
    }
}

// Archiv anzeigen

async function archivAnzeigen(){

    const container=document.getElementById("archivInhalt");

    container.innerHTML="<div class='empty'>Archiv wird geladen …</div>";

    try{

        const records=await alleBelege();

        if(!records.length){

            container.innerHTML="<div class='empty'>Noch keine Belege gespeichert.</div>";

            return;

        }

        records.sort((a,b)=>b.date.localeCompare(a.date));

        const grouped={};

        records.forEach(r=>{

            if(!grouped[r.year])grouped[r.year]={};

            if(!grouped[r.year][r.month])grouped[r.year][r.month]=[];

            grouped[r.year][r.month].push(r);

        });

        container.innerHTML="";

        Object.keys(grouped).sort().reverse().forEach(year=>{

            const ydiv=document.createElement("div");

            ydiv.className="archive-year";

            const yh=document.createElement("h3");

            yh.textContent=year;

            ydiv.appendChild(yh);

            Object.keys(grouped[year]).sort().reverse().forEach(month=>{

                const mdiv=document.createElement("div");

                mdiv.className="archive-month";

                const title=document.createElement("div");

                title.className="month-title";

                title.textContent=month;

                mdiv.appendChild(title);

                grouped[year][month].forEach(r=>{

                    const row=document.createElement("div");

                    row.className="archive-entry";

                    const info=document.createElement("div");

                    info.className="entry-info";

                    const name=document.createElement("div");

                    name.className="entry-name";

                    name.textContent=r.filename;

                    const detail=document.createElement("div");

                    detail.className="entry-detail";

                    detail.textContent=r.account+" – "+r.accountName+" | "+r.supplier+" | "+r.amount.toFixed(2)+" "+r.currency;

                    info.append(name,detail);

                    const actions=document.createElement("div");

                    actions.className="entry-actions";

                    const open=document.createElement("button");

                    open.className="open-btn";

                    open.textContent="Öffnen";

                    open.onclick=()=>belegOeffnen(r.id);

                    const del=document.createElement("button");

                    del.className="delete-btn";

                    del.textContent="Löschen";

                    del.onclick=()=>belegEntfernen(r.id,r.filename);

                    actions.append(open,del);

                    row.append(info,actions);

                    mdiv.appendChild(row);

                });

                ydiv.appendChild(mdiv);

            });

            container.appendChild(ydiv);

        });

    }catch(err){

        console.error(err);

        container.innerHTML="<div class='empty'>Archiv konnte nicht geladen werden.</div>";

    }

}



async function belegOeffnen(id){

    const records=await alleBelege();

    const record=records.find(r=>r.id===id);

    if(!record)return;

    const url=URL.createObjectURL(record.pdfBlob);

    const win=window.open(url,"_blank");

    if(!win)alert("Pop-up blockiert. Bitte Pop-ups erlauben oder erneut klicken.");

    setTimeout(()=>URL.revokeObjectURL(url),60000);

}



async function belegEntfernen(id,filename){

    if(!confirm("Diesen Beleg wirklich aus dem Archiv löschen?\n\n"+filename))return;

    await archivBelegLoeschen(id);

    archivAnzeigen();

}
